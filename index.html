<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>재즈 화성학 & 코드 마스터 퀴즈</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f1115; color: #f0f2f5; padding-bottom: 60px; font-size: 15px; }

    .container { max-width: 520px; margin: 0 auto; padding: 18px; }

    /* 상단 헤더 & 진행 바 */
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 21px; font-weight: 900; color: #38bdf8; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #94a3b8; }
    
    .score-board {
      display: flex; justify-content: space-between; align-items: center;
      background: #14171f; border: 1px solid #282d37; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 16px; font-weight: 700; font-size: 14px;
    }
    .score-board .streak { color: #f59e0b; }
    .score-board .acc { color: #22c55e; }

    /* 퀴즈 메인 카드 */
    .quiz-card {
      background: #181b22; border: 1px solid #282d37; border-radius: 14px;
      padding: 22px 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .q-category {
      display: inline-block; background: #2e1065; color: #e9d5ff; border: 1px solid #9333ea;
      font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; margin-bottom: 12px;
    }
    .q-title {
      font-size: 18px; font-weight: 800; line-height: 1.5; color: #f8fafc; margin-bottom: 20px;
    }

    /* 보기 버튼 목록 */
    .choices-grid { display: grid; gap: 10px; }
    .choice-btn {
      width: 100%; background: #21262d; border: 1px solid #30363d; color: #f1f5f9;
      padding: 15px 16px; border-radius: 10px; font-size: 15px; font-weight: 700;
      text-align: left; cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; justify-content: space-between;
    }
    .choice-btn:hover:not(:disabled) { background: #2d333b; border-color: #64748b; }
    .choice-btn:disabled { cursor: default; }

    /* 정답/오답 클릭 시 버튼 스타일 */
    .choice-btn.correct-choice {
      background: #14532d !important; border-color: #22c55e !important; color: #dcfce7 !important;
    }
    .choice-btn.wrong-choice {
      background: #450a0a !important; border-color: #ef4444 !important; color: #fee2e2 !important;
    }

    /* ========================================================
       ★ [시인성 극대화] 틀렸을 때 노출되는 정답 피드백 카드 박스 ★
       ======================================================== */
    .feedback-box {
      display: none; margin-top: 18px; border-radius: 12px; padding: 18px 16px;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 틀렸을 때 (빨간 경고 배경 + 형광 노란색 초대형 정답 폰트) */
    .feedback-box.wrong {
      background: #200d0d; border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    .feedback-box.wrong .fb-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 900; color: #fca5a5;
      background: #3b1111; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px;
    }
    .feedback-box.wrong .fb-answer-label {
      font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px;
    }
    .feedback-box.wrong .fb-answer-text {
      font-size: 26px; /* ★ 한눈에 들어오는 특대형 폰트 ★ */
      font-weight: 900; color: #fde047; /* 눈에 가장 잘 띄는 고대비 노란색 */
      line-height: 1.3; margin-bottom: 12px; letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(253, 224, 71, 0.2);
    }
    .feedback-box.wrong .fb-desc {
      font-size: 14px; line-height: 1.6; color: #f1f5f9; background: #160909;
      padding: 12px 14px; border-radius: 8px; border-left: 3px solid #ef4444;
    }

    /* 맞췄을 때 (초록 성공 배경) */
    .feedback-box.correct {
      background: #092013; border: 2px solid #22c55e;
    }
    .feedback-box.correct .fb-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 900; color: #86efac;
      background: #113820; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px;
    }
    .feedback-box.correct .fb-answer-text {
      font-size: 22px; font-weight: 900; color: #4ade80; margin-bottom: 8px;
    }
    .feedback-box.correct .fb-desc {
      font-size: 13.5px; line-height: 1.55; color: #e2e8f0;
    }

    /* 다음 문제 버튼 */
    .next-btn {
      width: 100%; background: #3b82f6; color: #fff; border: none;
      font-weight: 800; font-size: 16px; padding: 15px; border-radius: 10px;
      margin-top: 16px; cursor: pointer; display: none;
    }
    .next-btn:hover { background: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎸 Jazz Harmony Quiz</h1>
      <p>실전 화성학 & 코드톤 즉답 트레이닝</p>
    </div>

    <div class="score-board">
      <div>문제 <span id="qIndex">1</span> / <span id="qTotal">10</span></div>
      <div class="streak">연속 정답: <span id="streakCount">0</span>🔥</div>
      <div class="acc">점수: <span id="scoreVal">0</span>점</div>
    </div>

    <div class="quiz-card">
      <span class="q-category" id="qCat">화성학</span>
      <div class="q-title" id="qText">문제를 불러오는 중입니다...</div>
      
      <div class="choices-grid" id="choicesBox"></div>

      <!-- 정답 / 오답 알림 피드백 박스 -->
      <div class="feedback-box" id="feedbackBox">
        <div class="fb-badge" id="fbBadge">✕ 오답입니다</div>
        <div class="fb-answer-label" id="fbAnswerLabel">정답:</div>
        <div class="fb-answer-text" id="fbAnswerText">정답 내용</div>
        <div class="fb-desc" id="fbDesc">해설 내용</div>
      </div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 풀기 ➔</button>
    </div>
  </div>

  <script>
    // 퀴즈 데이터베이스 (다양한 재즈 화성학 & 코드 문제 예시)
    var quizData = [
      {
        cat: "2-5-1 진행",
        q: "Key of C Major에서 Ⅱ-Ⅴ-Ⅰ 진행의 구성 코드로 올바른 것은?",
        choices: [
          "Dm7 - G7 - Cmaj7",
          "Em7 - A7 - Dmaj7",
          "Fm7 - Bb7 - Ebmaj7",
          "Dm7 - Gmaj7 - C7"
        ],
        answer: 0,
        desc: "C Major 다이아토닉에서 2도는 Dm7, 5도는 도미넌트인 G7, 1도는 Cmaj7입니다."
      },
      {
        cat: "코드 텐션",
        q: "C7 (Dominant 7th) 코드에서 피해야 할 어보이드 노트(Avoid Note)는?",
        choices: [
          "9th (D음)",
          "11th (Natural 11, F음)",
          "#11th (F#음)",
          "13th (A음)"
        ],
        answer: 1,
        desc: "도미넌트 7th에서 완전 4도(Natural 11th)는 코드의 핵심 가이드톤인 3음(E)과 단9도(b9) 불협을 이루어 사용하지 않습니다. 대신 #11을 주로 씁니다."
      },
      {
        cat: "모달 인터체인지",
        q: "C Major 곡에서 동주음 단조(C Minor)로부터 빌려온 'bⅥmaj7' 코드는?",
        choices: [
          "Bbmaj7",
          "Abmaj7",
          "Dbmaj7",
          "Ebmaj7"
        ],
        answer: 1,
        desc: "C의 단6도 음은 Ab이므로, C 내추럴 마이너의 6번째 코드는 Abmaj7이 됩니다. 서브도미넌트 마이너(SDM)의 대표적인 대리 코드입니다."
      },
      {
        cat: "트리톤 서브 (대리 도미넌트)",
        q: "G7 코드를 대리할 수 있는 증4도(Tritone) 대리 코드는?",
        choices: [
          "C#7 (Db7)",
          "D7",
          "F#7",
          "Ab7"
        ],
        answer: 0,
        desc: "G7의 3음(B)과 7음(F)의 트라이톤 음정을 그대로 공유하는 코드는 반음 차이 대리 코드인 Db7(C#7)입니다."
      },
      {
        cat: "가이드톤 (Guide Tones)",
        q: "기타 쉘(Shell) 보이싱에서 화성의 뼈대를 이루는 필수 '가이드톤' 2개는?",
        choices: [
          "근음(1)과 5음",
          "3음과 7음",
          "5음과 텐션 9음",
          "근음(1)과 3음"
        ],
        answer: 1,
        desc: "3음은 코드의 성격(메이저/마이너)을 결정하고, 7음은 화성의 긴장과 기능(maj7/7/m7)을 결정하므로 3음과 7음이 핵심 가이드톤입니다."
      },
      {
        cat: "얼터드 스케일",
        q: "G7 Altered 스케일은 어떤 멜로딕 마이너 스케일의 7번째 모드인가?",
        choices: [
          "Ab 멜로딕 마이너",
          "A 멜로딕 마이너",
          "F 멜로딕 마이너",
          "C 멜로딕 마이너"
        ],
        answer: 0,
        desc: "어떤 도미넌트의 얼터드 스케일은 항상 그 코드의 '반음 위' 멜로딕 마이너(G7 → Ab Melodic Minor)와 동일한 구성을 갖습니다."
      }
    ];

    var curIdx = 0;
    var streak = 0;
    var score = 0;
    var answered = false;

    function initQuiz() {
      document.getElementById('qTotal').innerText = quizData.length;
      loadQuestion(curIdx);
    }

    function loadQuestion(idx) {
      answered = false;
      var q = quizData[idx];
      
      document.getElementById('qIndex').innerText = idx + 1;
      document.getElementById('qCat').innerText = q.cat;
      document.getElementById('qText').innerText = q.q;

      // 피드백 박스 & 다음 버튼 숨기기
      var fbBox = document.getElementById('feedbackBox');
      fbBox.style.display = 'none';
      fbBox.className = 'feedback-box';
      document.getElementById('nextBtn').style.display = 'none';

      // 보기 버튼 생성
      var choicesBox = document.getElementById('choicesBox');
      choicesBox.innerHTML = '';

      for (var i = 0; i < q.choices.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = '<span>' + (i + 1) + '. ' + q.choices[i] + '</span>';
        btn.setAttribute('onclick', 'checkAnswer(' + i + ')');
        choicesBox.appendChild(btn);
      }
    }

    function checkAnswer(selectedIdx) {
      if (answered) return;
      answered = true;

      var q = quizData[curIdx];
      var isCorrect = (selectedIdx === q.answer);
      var btns = document.querySelectorAll('.choice-btn');

      // 모든 버튼 비활성화 및 정답/오답 표시
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
        if (i === q.answer) {
          btns[i].classList.add('correct-choice');
        } else if (i === selectedIdx && !isCorrect) {
          btns[i].classList.add('wrong-choice');
        }
      }

      var fbBox = document.getElementById('feedbackBox');
      var fbBadge = document.getElementById('fbBadge');
      var fbAnswerLabel = document.getElementById('fbAnswerLabel');
      var fbAnswerText = document.getElementById('fbAnswerText');
      var fbDesc = document.getElementById('fbDesc');

      if (isCorrect) {
        streak++;
        score += 10;
        fbBox.className = 'feedback-box correct';
        fbBadge.innerHTML = '✓ 정답입니다!';
        fbAnswerLabel.style.display = 'none';
        fbAnswerText.innerText = q.choices[q.answer];
        fbDesc.innerText = q.desc;
      } else {
        streak = 0;
        fbBox.className = 'feedback-box wrong';
        fbBadge.innerHTML = '✕ 오답입니다!';
        fbAnswerLabel.style.display = 'block';
        fbAnswerLabel.innerText = '올바른 정답:';
        // ★ 오답 시 크고 굵은 노란색 폰트로 정답 즉시 노출 ★
        fbAnswerText.innerText = (q.answer + 1) + '번. ' + q.choices[q.answer];
        fbDesc.innerHTML = '<strong>[해설]</strong> ' + q.desc;
      }

      document.getElementById('streakCount').innerText = streak;
      document.getElementById('scoreVal').innerText = score;

      fbBox.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'block';
      
      // 모바일 화면에서 정답 카드가 잘 보이도록 부드럽게 스크롤
      fbBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function nextQuestion() {
      curIdx++;
      if (curIdx < quizData.length) {
        loadQuestion(curIdx);
      } else {
        // 모든 문제 완주 시
        var quizCard = document.querySelector('.quiz-card');
        quizCard.innerHTML = 
          '<div style="text-align:center; padding:30px 10px;">' +
            '<div style="font-size:42px; margin-bottom:12px;">🏆</div>' +
            '<h2 style="font-size:22px; font-weight:900; color:#facc15; margin-bottom:8px;">퀴즈 완주 성공!</h2>' +
            '<p style="font-size:15px; color:#cbd5e1; margin-bottom:20px;">최종 점수: <strong style="color:#22c55e; font-size:18px;">' + score + '점</strong></p>' +
            '<button onclick="location.reload()" style="background:#22c55e; color:#000; font-weight:900; font-size:15px; padding:14px 28px; border-radius:10px; border:none; cursor:pointer;">처음부터 다시 풀기</button>' +
          '</div>';
      }
    }

    // 초기 실행
    initQuiz();
  </script>
</body>
</html>
